<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda - El Club De Fans</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#f5f5f5}
.header{background:#fff;padding:10px 12px;position:sticky;top:0;z-index:99;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}
.logo-box{width:120px;height:36px;background:#000;color:#00ff41;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px}
.search{flex:1;background:#f0f0f0;border-radius:20px;padding:8px 14px;border:none;outline:none}
.cart-btn{background:#000;color:#fff;border:none;padding:8px 12px;border-radius:20px;font-size:13px;cursor:pointer}
.cart-btn span{background:#ff3b30;border-radius:50%;padding:2px 6px;margin-left:5px;font-size:11px}
.banner{background:#fb7701;color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#fff;border-radius:8px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.info{padding:8px}
.title{font-size:12px;line-height:14px;height:28px;overflow:hidden}
.price{color:#ff3b30;font-weight:900;font-size:16px;margin-top:4px}
.old{color:#999;font-size:11px;text-decoration:line-through;margin-left:4px}
.sold{font-size:10px;color:#666;margin-top:2px}
.btn-add{width:100%;margin-top:6px;background:#000;color:#fff;border:none;padding:6px;border-radius:20px;font-size:12px;font-weight:bold}
#cartDrawer{position:fixed;top:0;right:-100%;width:85%;max-width:360px;height:100%;background:#fff;z-index:1000;transition:.3s;padding:15px;overflow-y:auto;box-shadow:-5px 0 20px rgba(0,0,0,.2)}
#cartDrawer.open{right:0}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:999}
#overlay.show{display:block}
</style>
</head>
<body>

<div class="banner">🔥 ENVÍO GRATIS HOY - 90% OFF + 3 REGALOS 🔥</div>

<div class="header">
  <div class="logo-box">AQUÍ TU LOGO</div>
  <input class="search" placeholder="Buscar chorizos, lentes...">
  <button class="cart-btn" onclick="openCart()">🛒<span id="cartCount">0</span></button>
</div>

<div class="grid" id="grid"></div>

<div id="overlay" onclick="closeCart()"></div>
<div id="cartDrawer">
  <h3 style="display:flex;justify-content:space-between">Carrito <span onclick="closeCart()" style="cursor:pointer">X</span></h3>
  <div id="cartItems" style="margin-top:15px"></div>
  <div id="cartTotal" style="margin-top:15px;font-weight:900"></div>
  <button style="width:100%;margin-top:10px;background:#fb7701;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold" onclick="location.href='../chorizo/'">COMPRAR AHORA</button>
</div>

<script>
const productos = [

  {id:2,nombre:"Lata Chorizo Energy - Sabor a Chorizo Real",precio:4.50,precioOld:15.00,img:"https://via.placeholder.com/300/f00/fff?text=CHORIZO",vendidos:"8.1k+ vendidos",rating:"★ 4.8 (3,421)"},
  {id:3,nombre:"USB Perdido de Fernanfloo 32GB",precio:29.99,precioOld:89.99,img:"https://via.placeholder.com/300/000/00ff41?text=USB",vendidos:"666 vendidos",rating:"★ 5.0 (89)"},

  {id:5,nombre:"Gorra El Club De Fans - 10 Años",precio:7.50,precioOld:22.00,img:"https://via.placeholder.com/300/222/fff?text=GORRA",vendidos:"1.2k+ vendidos",rating:"★ 4.9 (341)"},
  {id:6,nombre:"Peluca Curly Power",precio:18.00,precioOld:45.00,img:"https://via.placeholder.com/300/ffcc00/000?text=PELUCA",vendidos:"3.8k+ vendidos",rating:"★ 4.6 (512)"},

  {id:14,nombre:"Caja Misteriosa 'NO ABRIR HASTA 2026'",precio:15.99,precioOld:49.99,img:"https://via.placeholder.com/300/111/0f0?text=CAJA",vendidos:"2,026 vendidos",rating:"★ 5.0 (2,026)"},
  {id:15,nombre:"Figura Fernan con Control",precio:22.50,precioOld:60.00,img:"https://via.placeholder.com/300/f00/fff?text=FIGURA",vendidos:"3k+ vendidos",rating:"★ 4.8 (890)"},

];

let carrito = [];
const grid = document.getElementById('grid');
productos.forEach(p=>{
  grid.innerHTML+=`
  <div class="card">
    <img src="${p.img}">
    <div class="info">
      <div class="title">${p.nombre}</div>
      <div style="font-size:10px">${p.rating}</div>
      <div><span class="price">$${p.precio}</span><span class="old">$${p.precioOld}</span></div>
      <div class="sold">${p.vendidos}</div>
      <button class="btn-add" onclick="addCart(${p.id})">Añadir al carrito</button>
    </div>
  </div>`;
});
function addCart(id){
  const prod = productos.find(x=>x.id===id);
  carrito.push(prod);
  document.getElementById('cartCount').innerText = carrito.length;
  renderCart();
  openCart();
}
function renderCart(){
  const c = document.getElementById('cartItems');
  c.innerHTML="";
  let total=0;
  carrito.forEach((p,i)=>{
    total+=p.precio;
    c.innerHTML+=`<div style="display:flex;gap:8px;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:8px"><img src="${p.img}" style="width:50px;height:50px;object-fit:cover"><div style="flex:1;font-size:12px">${p.nombre}<br><b>$${p.precio}</b
